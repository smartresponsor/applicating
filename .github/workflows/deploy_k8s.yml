name: distributed_deployment
on:
  workflow_dispatch:
jobs:
  k8s_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize || echo 'kubectl not installed (CI demo)'
  envoy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/envoy-validate
