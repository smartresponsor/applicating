name: ci-smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'templates/**'
      - 'public/**'
      - 'tools/smoke/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - '.github/workflows/ci-smoke.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'templates/**'
      - 'public/**'
      - 'tools/smoke/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - '.github/workflows/ci-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, simplexml, xml, dom, xmlwriter, json, libxml, tokenizer, sqlite3, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: QA environment preflight
        run: composer qa:env
      - name: Runtime smoke
        run: composer smoke:runtime
      - name: Fixture sanity smoke
        run: composer smoke:fixtures
      - name: Container smoke
        run: composer smoke:container
      - name: Fixture load smoke
        run: composer smoke:fixture-load
      - name: Doctrine mapping smoke
        run: composer smoke:doctrine
      - name: Admin surface smoke
        run: composer smoke:admin
      - name: Functional readiness smoke
        run: composer smoke:functional-readiness
