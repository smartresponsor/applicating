apiVersion: batch/v1
kind: CronJob
metadata:
  name: smartpolicy-audit-verify
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: audit-verify
              image: curlimages/curl:8.9.1
              command: ["/bin/sh","-c"]
              args:
                - curl -s "http://smartpolicy-gateway:8080/api/audit/check?depth=1000"
