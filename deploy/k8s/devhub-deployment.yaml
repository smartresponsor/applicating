apiVersion: apps/v1
kind: Deployment
metadata:
  name: devhub
  namespace: smartresponsor
spec:
  replicas: 1
  selector:
    matchLabels: { app: devhub }
  template:
    metadata:
      labels:
        app: devhub
    spec:
      containers:
        - name: devhub
          image: ghcr.io/demo/devhub:latest
          ports:
            - containerPort: 8084
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 15
