apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: smartresponsor
spec:
  replicas: 1
  selector:
    matchLabels: { app: marketplace }
  template:
    metadata:
      labels:
        app: marketplace
    spec:
      containers:
        - name: marketplace
          image: ghcr.io/demo/marketplace:latest
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 15
