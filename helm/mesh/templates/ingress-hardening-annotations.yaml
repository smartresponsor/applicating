apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartpolicy-mesh-secure
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  rules:
    - host: mesh.smartpolicy.local
      http:
        paths:
          - path: /api/policy/mesh/secure
            pathType: Prefix
            backend:
              service:
                name: smartpolicy-gateway
                port:
                  number: 8080
