name: admin-ui-build
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd admin-ui && npm i && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui/dist
