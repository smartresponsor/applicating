name: etl
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ETL usage
        run: php bin/etl-usage var/ingest/usage/sample.json || true
      - name: ETL billing (csv)
        run: php bin/etl-billing csv tenantA var/ingest/billing/sample.csv || true
      - name: ETL crm
        run: php bin/etl-crm || true
      - name: CDC replicate
        run: php bin/etl-cdc || true
