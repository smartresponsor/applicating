apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-renew
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: vault-renew
              image: myapp:latest
              command: ["/bin/sh","-c"]
              args: ["php -r 'require "vendor/autoload.php"; (new App\\Component\\Product\\Integration\\Vault\\VaultClient(getenv("VAULT_ADDR"), getenv("VAULT_TOKEN")))->renewSelf();'"]
              envFrom:
                - secretRef: { name: vault-secret }
          restartPolicy: OnFailure
