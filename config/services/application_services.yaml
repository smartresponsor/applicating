services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Applicating\:
        resource: '../../src/'
        exclude:
            - '../../src/Entity/'
            - '../../src/Kernel.php'

    App\Applicating\RepositoryInterface\ApplicationRepositoryInterface:
        alias: App\Applicating\Repository\ApplicationRepository
        public: true

    App\Applicating\RepositoryInterface\ApplicationReleaseRepositoryInterface:
        alias: App\Applicating\Repository\ApplicationReleaseRepository
        public: true

    App\Applicating\RepositoryInterface\ApplicationManifestRepositoryInterface:
        alias: App\Applicating\Repository\ApplicationManifestRepository
        public: true

    App\Applicating\RepositoryInterface\ApplicationTenantAssignmentRepositoryInterface:
        alias: App\Applicating\Repository\ApplicationTenantAssignmentRepository
        public: true

    App\Applicating\RepositoryInterface\ApplicationUserRepositoryInterface:
        alias: App\Applicating\Repository\ApplicationUserRepository
        public: true

    App\Applicating\RepositoryInterface\ApplicationRuntimeAssignmentRepositoryInterface:
        alias: App\Applicating\Repository\ApplicationRuntimeAssignmentRepository
        public: true

    App\Applicating\ResolverInterface\ApplicationRuntimeAssignmentResolverInterface:
        alias: App\Applicating\Resolver\ApplicationRuntimeAssignmentResolver
        public: true

    App\Applicating\ServiceInterface\ApplicationRuntimeAssignmentServiceInterface:
        alias: App\Applicating\Service\ApplicationRuntimeAssignmentService
        public: true

    App\Applicating\Command\ApplicationRuntimeSetCommand:
        tags: ['console.command']

    App\Applicating\ServiceInterface\ApplicationLifecycleServiceInterface:
        alias: App\Applicating\Service\ApplicationLifecycleService
        public: true

    App\Applicating\ServiceInterface\ApplicationManifestServiceInterface:
        alias: App\Applicating\Service\ApplicationManifestService
        public: true

    App\Applicating\ServiceInterface\ApplicationDiagnosticsServiceInterface:
        alias: App\Applicating\Service\ApplicationDiagnosticsService
        public: true

    App\Applicating\ServiceInterface\ApplicationReportServiceInterface:
        alias: App\Applicating\Service\ApplicationReportService
        public: true

    App\Applicating\BuilderInterface\ApplicationAdminViewBuilderInterface:
        alias: App\Applicating\Builder\ApplicationAdminViewBuilder
        public: true

    App\Applicating\ServiceInterface\ApplicationReadinessServiceInterface:
        alias: App\Applicating\Service\ApplicationReadinessService
        public: true

    App\Applicating\ServiceInterface\ApplicationHealthServiceInterface:
        alias: App\Applicating\Service\ApplicationHealthService
        public: true

when@dev:
    services:
        Doctrine\Bundle\FixturesBundle\Loader\SymfonyFixturesLoader:
            alias: doctrine.fixtures.loader
