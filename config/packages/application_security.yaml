security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        applicating_persistent_users:
            entity:
                class: App\Applicating\Entity\ApplicationUser
                property: userIdentifier

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: applicating_persistent_users
            user_checker: App\Applicating\Security\ApplicationUserChecker
            login_throttling:
                max_attempts: 5
            form_login:
                login_path: applicating_security_login
                check_path: applicating_security_login
                enable_csrf: true
                default_target_path: applicating_application_index
            logout:
                path: applicating_security_logout
                target: applicating_security_login
