apiVersion: batch/v1
kind: CronJob
metadata:
  name: smartpolicy-orchestrator-review
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: review
              image: curlimages/curl:8.9.1
              command: ["/bin/sh","-c"]
              args:
                - echo "Periodic orchestrator review (placeholder)"
