sources:
  usage_json:
    path: var/ingest/usage/*.json
  billing_csv:
    path: var/ingest/billing/*.csv
  crm_webhook:
    endpoint: /api/ingest/crm
  stripe:
    api_key: STRIPE_API_KEY  # использовать переменные окружения
targets:
  db_url: ${DATABASE_URL}
  schema: public
options:
  batch_size: 1000
  duplicate_policy: upsert
