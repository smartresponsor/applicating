services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Symfony-native component export surface.
  # The host application may import this file from the component root.
  App\Applicating\:
    resource: '../../src/'
    exclude:
      - '../../src/Kernel.php'
      - '../../src/DependencyInjection/'
      - '../../src/Entity/'
      - '../../src/Tests/'

  App\Applicating\RepositoryInterface\ApplicationRuntimeAssignmentRepositoryInterface:
    alias: App\Applicating\Repository\ApplicationRuntimeAssignmentRepository
    public: true

  App\Applicating\ServiceInterface\ApplicationRuntimeAssignmentResolverInterface:
    alias: App\Applicating\Service\ApplicationRuntimeAssignmentResolver
    public: true

  App\Applicating\ServiceInterface\ApplicationRuntimeAssignmentServiceInterface:
    alias: App\Applicating\Service\ApplicationRuntimeAssignmentService
    public: true

  App\Applicating\Command\ApplicatingRuntimeSetCommand:
    tags: ['console.command']

  App\Applicating\Service\Config\ApplicatingFrameworkConfigService:
    arguments:
      $projectDir: '%kernel.project_dir%'
    tags: ['administering.config_tool']
