name: admin-integration-check
on: { workflow_dispatch: {} }
jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          test -f config/routes/admin.yaml
          test -f src/Security/Admin/AdminAccessVoter.php
          test -f admin-ui/src/pages/Login.tsx
          echo 'admin integration scaffolding ok'
