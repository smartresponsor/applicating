name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, simplexml, xml, dom, xmlwriter, json, libxml, tokenizer, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer release:verify
      - name: Build Applicating runtime archive
        run: bash tools/release/make-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applicating-inspection-reports
          path: report/inspection
      - uses: actions/upload-artifact@v4
        with:
          name: applicating-runtime
          path: applicating-runtime.zip
