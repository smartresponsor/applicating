apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-staging
  namespace: argocd
spec:
  project: catalog
  source:
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: main
    path: helm/catalog
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
