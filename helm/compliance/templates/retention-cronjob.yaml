apiVersion: batch/v1
kind: CronJob
metadata:
  name: smartpolicy-compliance-retention-sweep
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention-sweep
              image: curlimages/curl:8.9.1
              command: ["/bin/sh","-c"]
              args:
                - curl -s -X POST "http://smartpolicy-gateway:8080/api/compliance/retention/sweep"
