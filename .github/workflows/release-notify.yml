name: release-notify
on:
  release:
    types: [published]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json'             --data '{"text":"🚀 New release published: ${{ github.event.release.tag_name }}"}'             ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Notify Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage             -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }}             -d text="New release published: ${{ github.event.release.tag_name }}"
