apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: smartresponsor
spec:
  replicas: 1
  selector:
    matchLabels: { app: billing }
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: billing
          image: ghcr.io/demo/billing:latest
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
